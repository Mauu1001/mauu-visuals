<style>
:root{--bg:#fff;--fg:#0a0a0a;--mute:#52525b;--line:#e4e4e7;--card:#f4f4f5;--acct:#2563EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#fafafa;--mute:#a1a1aa;--line:#27272a;--card:#141417;--acct:#60A5FA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#fafafa;--mute:#a1a1aa;--line:#27272a;--card:#141417;--acct:#60A5FA;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(4.5rem + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45}
:focus-visible{outline:2px solid var(--acct);outline-offset:3px}
.glass{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
.pop{animation:pop .4s both}@keyframes pop{from{opacity:0;transform:scale(.97)}}
.mq{display:flex;width:max-content;animation:mq 28s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.noscroll{scrollbar-width:none}
.blob{position:absolute;border-radius:9999px;filter:blur(70px);will-change:transform;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(9vw,7vh) scale(1.25)}}
.grid-floor{position:absolute;left:-50%;right:-50%;bottom:-8%;height:62%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;background-image:linear-gradient(to right,color-mix(in srgb,#2563EB 45%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,#2563EB 45%,transparent) 1px,transparent 1px);background-size:56px 56px;animation:floor 2.6s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
@keyframes floor{to{background-position:0 56px}}
.spot{position:absolute;inset:0;background:radial-gradient(440px circle at var(--mx,50%) var(--my,35%),rgba(37,99,235,.3),transparent 60%)}
.fl{position:absolute;animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-24px) rotate(20deg)}}.noscroll::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:9999px;padding:.75rem 1.5rem;font-size:.875rem;font-weight:600;transition:all .2s}
.btn-p{background:#2563EB;color:#fff}.btn-p:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn-o{border:1.5px solid var(--fg)}.btn-o:hover{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{transform:none}.pop{animation:none}}
</style>

  const init=()=>{try{const s=localStorage.getItem("theme");if(s)return s}catch(e){}return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"};
  const [t,setT]=useState(init);
  useEffect(()=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}},[t]);
  return [t,()=>setT(x=>x==="dark"?"light":"dark")];
}
function Reveal({children,className="",delay=0}){
  const ref=useRef(null),[on,setOn]=useState(false);
  useEffect(()=>{
    const el=ref.current;
    if(!el||!("IntersectionObserver" in window)){setOn(true);return}
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setOn(true);io.disconnect()}},{threshold:.1});
    io.observe(el);return()=>io.disconnect();
  },[]);
  return html`<div ref=${ref} className=${"rv "+(on?"in ":"")+className} style=${{transitionDelay:delay+"ms"}}>${children}</div>`;
}
const Heading=({eyebrow,title,sub})=>html`<${Reveal} className="mb-10 md:mb-14">
  <p className="mb-3 text-sm font-semibold uppercase tracking-widest text-acct">${eyebrow}</p>
  <h2 className="font-display text-5xl font-bold uppercase leading-none tracking-tight sm:text-6xl md:text-7xl">${title}</h2>
  ${sub&&html`<p className="mt-4 text-lg text-mute">${sub}</p>`}
</${Reveal}>`;

/* Fades each chapter in as it enters the screen and out as it leaves (opacity only, no layout cost) */
function Chapter({children}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;let raf=0;
    const run=()=>{raf=0;const r=el.getBoundingClientRect(),vh=innerHeight,z=vh*.3;
      const a=Math.min(1,Math.max(0,(vh-r.top)/z)),b=Math.min(1,Math.max(0,r.bottom/z));
      el.style.opacity=Math.min(a,b).toFixed(3)};
    const on=()=>{raf||(raf=requestAnimationFrame(run))};
    run();addEventListener("scroll",on,{passive:true});addEventListener("resize",on);
    return()=>{removeEventListener("scroll",on);removeEventListener("resize",on);cancelAnimationFrame(raf)};
  },[]);
  return html`<div ref=${ref}>${children}</div>`;
}

function Navbar({theme,toggle}){
  return html`<header className="glass fixed inset-x-0 top-0 z-40 border-b border-line" style=${{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <nav aria-label="Main navigation" className="mx-auto flex h-16 max-w-6xl items-center justify-between gap-3 px-5">
      <a href="#top" aria-label=${S.brand+" – back to top"} className="font-display text-lg font-bold uppercase tracking-tight sm:text-xl">${S.brand}<span className="text-brand">.</span></a>
      <ul className="flex items-center gap-4 sm:gap-8">${S.nav.map(l=>html`<li key=${l.id}><a href=${"#"+l.id} className="text-xs font-medium text-mute transition hover:text-fg sm:text-sm">${l.label}</a></li>`)}</ul>
      <div className="flex items-center gap-2">
        <ul className="hidden gap-2 md:flex">${S.social.map(s=>html`<li key=${s.name}><a href=${s.href} target="_blank" rel="noopener noreferrer" aria-label=${s.name+" (opens in a new tab)"} className="grid h-10 w-10 place-items-center rounded-full border border-line transition hover:border-brand hover:text-acct"><${Icon} n=${s.icon} size=${17}/></a></li>`)}</ul>
        <button onClick=${toggle} aria-label=${theme==="dark"?"Switch to light mode":"Switch to dark mode"} className="grid h-10 w-10 place-items-center rounded-full border border-line transition hover:border-fg"><${Icon} n=${theme==="dark"?"sun":"moon"} size=${17}/></button>
      </div>
    </nav>
  </header>`;
}

/* Animated hero background: drifting glow blobs, moving perspective grid, floating shapes, mouse spotlight */
function HeroBg(){
  const ref=useRef(null);
  useEffect(()=>{
    const host=ref.current.parentElement;let raf=0,x=0,y=0;
    const mv=e=>{const r=host.getBoundingClientRect();x=e.clientX-r.left;y=e.clientY-r.top;raf||(raf=requestAnimationFrame(()=>{raf=0;ref.current.style.setProperty("--mx",x+"px");ref.current.style.setProperty("--my",y+"px")}))};
    host.addEventListener("pointermove",mv);
    return()=>{host.removeEventListener("pointermove",mv);cancelAnimationFrame(raf)};
  },[]);
  return html`<div ref=${ref} aria-hidden="true" className="pointer-events-none absolute inset-0 overflow-hidden">
    <div className="blob -left-[10%] -top-[8%] h-[42vmax] w-[42vmax] bg-brand opacity-40"></div>
    <div className="blob -right-[12%] top-[18%] h-[38vmax] w-[38vmax] opacity-30" style=${{background:"#6366f1",animationDuration:"23s",animationDelay:"-6s"}}></div>
    <div className="blob bottom-[2%] left-[38%] h-[16vmax] w-[16vmax] bg-sun opacity-20" style=${{animationDuration:"15s",animationDelay:"-3s"}}></div>
    <div className="spot"></div>
    <div className="grid-floor"></div>
    <div className="fl left-[5%] top-[20%] h-14 w-14 rounded-full border-4 border-brand sm:left-[9%] sm:h-16 sm:w-16"></div>
    <div className="fl right-[6%] top-[27%] h-8 w-8 rotate-12 bg-sun sm:right-[11%] sm:h-10 sm:w-10" style=${{animationDuration:"9s",animationDelay:"-2s"}}></div>
    <div className="fl bottom-[34%] right-[14%] hidden font-display text-6xl font-bold text-brand sm:block" style=${{animationDuration:"8s",animationDelay:"-4s"}}>+</div>
    <div className="fl bottom-[30%] left-[13%] hidden h-12 w-12 rotate-12 border-4 border-fg sm:block" style=${{animationDuration:"10s",animationDelay:"-1s"}}></div>
    <div className="absolute inset-x-0 bottom-0 h-32" style=${{background:"linear-gradient(to top,var(--bg),transparent)"}}></div>
  </div>`;
}

function Hero(){
  return html`<section id="top" className="relative flex min-h-screen flex-col items-center justify-center overflow-hidden px-5 pb-16 pt-28 text-center">
    <${HeroBg}/>
    <div className="relative">
      <img src=${S.pfp} alt=${S.pfpAlt} className="mx-auto h-28 w-28 rounded-full object-cover ring-4 ring-brand shadow-[0_0_60px_rgba(37,99,235,.65)] md:h-32 md:w-32"/>
      <p className="mx-auto mt-6 inline-flex items-center gap-2 rounded-full border border-line bg-card px-4 py-1.5 text-xs font-semibold uppercase tracking-widest"><span aria-hidden="true" className="relative flex h-2.5 w-2.5"><span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-400 opacity-75"></span><span className="relative inline-flex h-2.5 w-2.5 rounded-full bg-green-500"></span></span>${S.badge}</p>
      <h1 className="mt-5 font-display text-[clamp(3rem,13vw,9rem)] font-bold uppercase leading-[.92] tracking-tight">${S.brand}</h1>
      <p className="mt-4 font-display text-xl font-semibold sm:text-3xl">${S.tagline}</p>
      <p className="mt-3 text-mute">${S.role}</p>
      <div className="mt-8 flex flex-wrap justify-center gap-3">
        <a href="#work" className="btn btn-p">View My Work</a>
        <a href="#contact" className="btn btn-o">Get in Touch</a>
      </div>
      <dl className="mx-auto mt-12 grid max-w-md grid-cols-3 gap-4">${S.stats.map(s=>html`<div key=${s.l}><dt className="sr-only">${s.l}</dt><dd className="font-display text-3xl font-bold text-acct sm:text-4xl">${s.v}</dd><dd className="text-xs uppercase tracking-widest text-mute">${s.l}</dd></div>`)}</dl>
    </div>
    <p className="relative mt-12 text-xs uppercase tracking-widest text-mute">Scroll to explore ↓</p>
  </section>`;
}

function Marquee(){
  const items=[...S.marquee,...S.marquee];
  return html`<div aria-hidden="true" className="overflow-hidden border-y border-line py-4"><div className="mq">
    ${[0,1].map(k=>html`<div key=${k} className="flex shrink-0">${items.map((w,i)=>html`<span key=${i} className="px-5 font-display text-lg font-bold uppercase tracking-widest">${w}<span className="ml-10 text-brand">✦</span></span>`)}</div>`)}
  </div></div>`;
}

function Modal({p,onClose}){
  const btn=useRef(null);
  useEffect(()=>{
    const prev=document.activeElement,k=e=>e.key==="Escape"&&onClose();
    addEventListener("keydown",k);document.body.style.overflow="hidden";btn.current&&btn.current.focus();
    return()=>{removeEventListener("keydown",k);document.body.style.overflow="";prev&&prev.focus&&prev.focus()};
  },[]);
  return html`<div role="dialog" aria-modal="true" aria-labelledby="m-title" onClick=${onClose} className="pop fixed inset-0 z-50 flex items-center justify-center p-4" style=${{background:"rgba(0,0,0,.85)"}}>
    <div onClick=${e=>e.stopPropagation()} className="relative grid max-h-full w-full max-w-5xl overflow-auto rounded-2xl bg-bg md:grid-cols-[1.6fr_1fr]">
      <img src=${p.image} alt=${p.alt||p.title} className="max-h-[60vh] w-full bg-card object-contain md:h-full md:max-h-[85vh]"/>
      <div className="flex flex-col justify-center p-6 md:p-10">
        <p className="mb-2 text-sm font-semibold uppercase tracking-widest text-acct">${p.category}</p>
        <h3 id="m-title" className="font-display text-3xl font-bold">${p.title}</h3>
        <p className="mt-4 text-mute">${p.desc}</p>
        <a href="#contact" onClick=${onClose} className="btn btn-p mt-8 self-start">Start a similar project</a>
      </div>
      <button ref=${btn} onClick=${onClose} aria-label="Close project" className="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full bg-bg text-fg shadow"><${Icon} n="close" size=${18}/></button>
    </div>
  </div>`;
}

function Work(){
  const ref=useRef(null),[sel,setSel]=useState(null);
  const go=d=>ref.current&&ref.current.scrollBy({left:d*ref.current.clientWidth*.8,behavior:"smooth"});
  const arrow="grid h-12 w-12 place-items-center rounded-full border border-line transition hover:border-brand hover:bg-brand hover:text-white";
  return html`<section id="work" className="py-24"><div className="mx-auto max-w-6xl px-5">
    <div className="flex items-end justify-between gap-4">
      <${Heading} eyebrow=${S.workEyebrow} title=${S.workTitle}/>
      <div className="mb-10 flex gap-2 md:mb-14">
        <button onClick=${()=>go(-1)} aria-label="Previous projects" className=${arrow}><${Icon} n="left" size=${20}/></button>
        <button onClick=${()=>go(1)} aria-label="Next projects" className=${arrow}><${Icon} n="right" size=${20}/></button>
      </div>
    </div>
    <ul ref=${ref} className="noscroll -mx-5 flex snap-x snap-mandatory gap-5 overflow-x-auto px-5 pb-2">
      ${S.projects.map(p=>html`<li key=${p.id} className="w-[85%] shrink-0 snap-start sm:w-[58%] lg:w-[44%]">
        <button onClick=${()=>setSel(p)} aria-label=${"Open project: "+p.title} className="group relative block w-full overflow-hidden rounded-2xl bg-card text-left">
          <img src=${p.image} alt=${p.alt||p.title} loading="lazy" decoding="async" style=${{aspectRatio:"16/9"}} className="w-full object-cover transition duration-500 group-hover:scale-105"/>
          <span className="absolute inset-x-0 bottom-0 block translate-y-full bg-black p-4 text-white transition duration-300 group-hover:translate-y-0 group-focus-visible:translate-y-0">
            <span className="block text-xs font-semibold uppercase tracking-widest text-sun">${p.category}</span>
            <span className="block font-display text-lg font-bold">${p.title}</span>
          </span>
        </button>
      </li>`)}
    </ul>
    ${sel&&ReactDOM.createPortal(html`<${Modal} p=${sel} onClose=${()=>setSel(null)}/>`,document.body)}
  </div></section>`;
}

function Clients(){
  return html`<section id="clients" className="px-5 py-24"><div className="mx-auto max-w-6xl">
    <${Heading} eyebrow=${S.clientsEyebrow} title=${S.clientsTitle}/>
    <${Reveal}>
      <div className="rounded-3xl border border-dashed border-line bg-card px-6 py-16 text-center">
        <p className="font-display text-4xl font-bold uppercase tracking-tight sm:text-6xl">${S.clientsSoon}</p>
        <p className="mx-auto mt-4 max-w-md text-mute">${S.clientsText}</p>
        <a href="#contact" className="btn btn-p mt-8">Be my first client</a>
      </div>
    </${Reveal}>
  </div></section>`;
}

function Contact(){
  return html`<section id="contact" className="px-5 py-24"><div className="mx-auto max-w-6xl">
    <${Heading} eyebrow=${S.contactEyebrow} title=${S.contactTitle} sub=${S.contactSub}/>
    <ul className="grid gap-5 md:grid-cols-3">
      ${S.buttons.map((b,i)=>html`<li key=${b.key}><${Reveal} delay=${i*80} className="h-full">
        <a href=${b.href} target="_blank" rel="noopener noreferrer" aria-label=${b.label+" (opens in a new tab)"} className="group flex h-full min-h-[15rem] flex-col justify-between rounded-3xl border border-line bg-card p-7 transition duration-300 hover:-translate-y-1.5 hover:border-brand hover:bg-brand hover:text-white hover:shadow-xl">
          <span className="grid h-14 w-14 place-items-center rounded-2xl bg-brand text-white transition duration-300 group-hover:bg-sun group-hover:text-black"><${Icon} n=${b.icon} size=${26}/></span>
          <span>
            <span className="block font-display text-2xl font-bold leading-tight">${b.label}</span>
            <span className="mt-2 block text-sm text-mute transition group-hover:text-white">${b.hint}</span>
            <span className="mt-5 inline-flex items-center gap-2 rounded-full border border-current px-4 py-2 text-sm font-semibold">${b.cta}<${Icon} n="arrow" size=${16}/></span>
          </span>
        </a>
      </${Reveal}></li>`)}
    </ul>
  </div></section>`;
}

function Footer(){
  return html`<footer className="border-t border-line px-5 py-12"><div className="mx-auto flex max-w-6xl flex-col items-center justify-between gap-6 text-center sm:flex-row sm:text-left">
    <div><p className="font-display text-2xl font-bold uppercase">${S.brand}<span className="text-brand">.</span></p><p className="text-sm text-mute">${S.tagline}</p></div>
    <p className="text-sm text-mute">© ${new Date().getFullYear()} ${S.brand} · All rights reserved</p>
    <ul className="flex gap-3">${S.social.map(s=>html`<li key=${s.name}><a href=${s.href} target="_blank" rel="noopener noreferrer" aria-label=${s.name+" (opens in a new tab)"} className="grid h-11 w-11 place-items-center rounded-full border border-line transition hover:border-brand hover:bg-brand hover:text-white"><${Icon} n=${s.icon} size=${19}/></a></li>`)}</ul>
  </div></footer>`;
}

function App(){
  const [theme,toggle]=useTheme();
  return html`<div><${Navbar} theme=${theme} toggle=${toggle}/><main><${Chapter}><${Hero}/></${Chapter}><${Marquee}/><${Chapter}><${Work}/></${Chapter}><${Chapter}><${Clients}/></${Chapter}><${Chapter}><${Contact}/></${Chapter}></main><${Footer}/></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
